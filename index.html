<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- CSP nghiêm ngặt: Fluxa không dùng eval, không cần script/style inline -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'self'; object-src 'none'" />
  <meta name="referrer" content="no-referrer" />
  <title>Fluxa.js demo</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="fluxa.css" />
</head>
<body>
  <div id="app"></div>
  <noscript>Trang này cần JavaScript.</noscript>
  <script type="module" src="app.js"></script>
</body>
</html>
